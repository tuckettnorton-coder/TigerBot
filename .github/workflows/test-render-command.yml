name: Render Command Tests

on:
  push:
    branches:
      - main
      - feature/schematic-render-command
    paths:
      - 'src/commands/Tools/render.js'
      - 'src/handlers/loaders/commandLoader.js'
      - 'tests/render.test.js'
      - '.github/workflows/test-render-command.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/commands/Tools/render.js'
      - 'tests/render.test.js'
      - '.github/workflows/test-render-command.yml'

permissions:
  contents: read

jobs:
  render-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run render tests
        run: node --test tests/render.test.js
