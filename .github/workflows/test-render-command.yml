name: Render Command Tests

on:
  push:
    branches:
      - main
      - feature/schematic-render-command
      - feat/render-material-dropdown-textures-20261013
    paths:
      - 'src/commands/Tools/render.js'
      - 'src/handlers/loaders/commandLoader.js'
      - 'src/app.js'
      - 'tests/render.test.js'
      - 'tests/render-ui.test.js'
      - 'src/services/renderMaterialUi.js'
      - 'src/interactions/buttons/renderMaterials.js'
      - 'src/interactions/buttons/renderMaterialPage.js'
      - 'src/interactions/selectMenus/renderMaterialPicker.js'
      - '.github/workflows/test-render-command.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/commands/Tools/render.js'
      - 'src/handlers/loaders/commandLoader.js'
      - 'src/app.js'
      - 'tests/render.test.js'
      - '.github/workflows/test-render-command.yml'

permissions:
  contents: read

jobs:
  render-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check command registration syntax
        run: node --check src/app.js && node --check src/handlers/loaders/commandLoader.js && node --check src/commands/Tools/render.js
      - name: Run render tests
        run: node --test tests/render.test.js
