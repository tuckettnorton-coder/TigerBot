name: Build Tiger Macro

on:
  push:
    branches:
      - tmp/tiger-macro-build-20261008
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiger-macro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload release JARs
        uses: actions/upload-artifact@v4
        with:
          name: tiger-macro-release
          path: tiger-macro/build/libs/*.jar
          if-no-files-found: error
