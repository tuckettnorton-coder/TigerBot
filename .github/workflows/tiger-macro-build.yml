name: Build Tiger Macro 1.0.3

on:
  workflow_dispatch:
  push:
    paths:
      - 'tiger-macro-1.0.3/**'
      - '.github/workflows/tiger-macro-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 9.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2'

      - name: Build with Loom
        working-directory: tiger-macro-1.0.3
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify no development Minecraft packages were packaged
        working-directory: tiger-macro-1.0.3
        run: |
          set -euxo pipefail
          JAR=build/libs/tiger-macro-1.0.3.jar
          test -f "$JAR"
          if jar tf "$JAR" | grep -q '^net/minecraft/'; then exit 1; fi

      - name: Verify FabricLoader interface invocation
        working-directory: tiger-macro-1.0.3
        run: |
          set -euxo pipefail
          JAR=build/libs/tiger-macro-1.0.3.jar
          javap -classpath "$JAR" -v -p com.tigerfx.tigermacro.TigerMacroClient > verbose.txt
          grep -q 'InterfaceMethodref.*net/fabricmc/loader/api/FabricLoader.getInstance' verbose.txt
          javap -classpath "$JAR" -c -p com.tigerfx.tigermacro.TigerMacroClient > bytecode.txt
          grep -q 'invokeinterface' bytecode.txt

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: tiger-macro-1.0.3
          path: tiger-macro-1.0.3/build/libs/tiger-macro-1.0.3.jar
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: tiger-macro-1.0.3-source
          path: tiger-macro-1.0.3
          if-no-files-found: error
