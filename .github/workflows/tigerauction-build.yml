name: Build TigerAuction 1.1.0
on:
  push:
    branches: [build/tigerauction-1.1.0-isolated]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract source
        run: mkdir -p tigerauction-build/source && base64 -d tigerauction-build/tigerauction-src.tar.xz.b64 | tar -xJ -C tigerauction-build/source
      - name: Build mod
        working-directory: tigerauction-build/source
        run: gradle --no-daemon clean build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TigerAuction-1.1.0-built
          path: tigerauction-build/source/build/libs/*.jar
