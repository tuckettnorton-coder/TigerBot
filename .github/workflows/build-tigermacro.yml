name: Build Tiger Macro 1.21.11 JAR

on:
  pull_request:
  push:
    branches:
      - build/tigermacro-1.21.11-jar

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build mod
        working-directory: TigerMacro-1.21.11
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: TigerMacro-1.21.11-JAR
          path: TigerMacro-1.21.11/build/libs/tiger-macro-1.0.0.jar
