name: Build Spacebar Macro

on:
  push:
    branches:
      - spacebar-macro-1.21.11
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle 9.2.1
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-9.2.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build mod
        working-directory: spacebar-macro
        run: /tmp/gradle-9.2.1/bin/gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: spacebar-macro-1.0.0
          path: spacebar-macro/build/libs/spacebar-macro-1.0.0.jar
          if-no-files-found: error
