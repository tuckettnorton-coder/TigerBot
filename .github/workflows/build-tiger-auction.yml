name: Build Tiger Auction JAR

on:
  push:
    branches:
      - tiger-auction-build
    paths:
      - 'TigerAuction-1.21.11/**'
      - '.github/workflows/build-tiger-auction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build mod
        run: gradle --no-daemon clean build -p TigerAuction-1.21.11
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TigerAuction-1.21.11-JAR
          path: TigerAuction-1.21.11/build/libs/tiger-auction-1.0.0.jar
          if-no-files-found: error
          retention-days: 7
