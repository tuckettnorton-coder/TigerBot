name: TigerDropperDemo 26.3 Build
on:
  push:
    branches: [ 'sandbox/tigerdropper-26.3-build' ]
    paths:
      - 'tigerdropper-build/**'
      - '.github/workflows/tigerdropper-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile with Minecraft 26.3 and Fabric 0.166.2
        working-directory: tigerdropper-build
        run: gradle build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TigerDropperDemo-26.3-icons-JAR
          path: tigerdropper-build/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: TigerDropperDemo-26.3-icons-source
          path: |
            tigerdropper-build/build.gradle
            tigerdropper-build/settings.gradle
            tigerdropper-build/gradle.properties
            tigerdropper-build/src/main/**
