name: Build Tiger Macro

on:
  push:
    branches:
      - main
      - build/tiger-macro-1.21.11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'

      - name: Build and test
        working-directory: .
        run: gradle clean build --no-daemon

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: tiger-macro-1.21.11-build
          path: |
            build/libs/*.jar
            build/test-results/**/*.xml
            build/reports/tests/**
          if-no-files-found: error
